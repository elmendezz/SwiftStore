#
#   build.yml
#   SwiftStore CI/CD
#
#   Version: 1.2
#   Changelog:
#   - Version 1.0: Build inicial de IPA con Artifacts y GitHub Releases.
#   - Version 1.1: Agregado bloque de permisos 'contents: write' para corregir error 403 al crear Releases y actualizado a Node 24 para evitar aviso de deprecación.
#   - Version 1.2: Trasladada la lógica de incremento de versión de version.sync directamente al workflow para actualizar el repo automáticamente en cada ejecucion.
#

name: Build SwiftStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update App Version & Commit
        id: bump_version
        run: |
          VERSION_FILE="version.sync"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "3.1.5" > "$VERSION_FILE"
          fi

          CURRENT_VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          RAND=$((RANDOM % 100 + 1))

          if [ "$RAND" -le 5 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$RAND" -le 20 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > "$VERSION_FILE"
          echo "APP_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Nueva versión generada: $NEW_VERSION"

          if [ -f "Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_VERSION" Info.plist 2>/dev/null || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE" Info.plist 2>/dev/null || git add "$VERSION_FILE"
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Setup macOS SDK and Compile
        run: |
          mkdir -p Payload/SwiftStore.app

          if [ -f "Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION }}" Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.APP_VERSION }}" Info.plist 2>/dev/null || true
          fi

          swiftc -parse-as-library \
                 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable *.swift \
                 -o Payload/SwiftStore.app/SwiftStore

          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/SwiftStore.app/Info.plist
          fi

          zip -r SwiftStore.ipa Payload

      - name: Upload SwiftStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftStore-${{ env.APP_VERSION }}
          path: SwiftStore.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SwiftStore-${{ env.APP_VERSION }}
          name: SwiftStore ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: SwiftStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
