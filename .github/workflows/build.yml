name: Build SwiftStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup macOS SDK and Compile
        run: |
          mkdir -p Payload/SwiftStore.app
          
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable SideloadApp.swift \
                 -o Payload/SwiftStore.app/SwiftStore
          
          cp Info.plist Payload/SwiftStore.app/Info.plist
          zip -r SwiftStore.ipa Payload

      - name: Upload SwiftStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftStore-IPA
          path: SwiftStore.ipa
